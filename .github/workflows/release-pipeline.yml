name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    name: Auto-fix harmless issues (format/lint) and commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message || '', 'chore(ci): auto-fix formatting and lint issues')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff autopep8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      - name: Auto-fix Python issues
        run: |
          ruff check . --fix || true
          autopep8 -r -i . || true

      - name: Auto-fix frontend issues
        run: |
          if [ -f package.json ]; then
            npx prettier --write .
            npx --no-install eslint . --fix || true
          fi

      - name: Commit and push auto-fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): auto-fix formatting and lint issues [skip ci]"
            git push
          else
            echo "No auto-fixes to commit."
          fi

  python-ci:
    name: Python CI (Ruff, Mypy, Pylint, Radon, Bandit, Pytest)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint radon bandit pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Fast Linter & Formatter)
        run: ruff check .

      - name: Run Mypy (Type Checking)
        run: mypy .

      - name: Run Pylint (Code Quality)
        run: pylint $(git ls-files '*.py')

      - name: Run Radon (Code Complexity Analysis)
        run: radon cc . -a -s

      - name: Run Bandit (Security Audit)
        run: bandit -r . -ll

      - name: Run Pytest with Coverage (>80%)
        run: pytest --cov=. --cov-fail-under=80

  frontend-ci:
    name: Frontend CI (Prettier, ESLint, TypeScript)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      - name: Run Prettier (Format Check)
        run: |
          if [ -f package.json ]; then npx prettier --check .; fi

      - name: Run ESLint (Linter)
        run: |
          if [ -f package.json ]; then npx --no-install eslint .; fi

      - name: Run TypeScript Compiler (Type Check)
        run: |
          if [ -f package.json ]; then npx tsc --noEmit; fi
