name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    name: Auto-fix harmless issues (format/lint) and commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message || '', 'chore(ci): auto-fix formatting and lint issues')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff autopep8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      # Get list of changed frontend files
      - name: Get changed frontend files
        id: changed-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.{js,jsx,ts,tsx,json,css,scss,md}

      - name: Auto-fix Python issues
        run: |
          ruff check . --fix || true
          autopep8 -r -i . || true

      - name: Auto-fix frontend issues on changed files
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -f package.json ]; then
            npx prettier --write ${{ steps.changed-frontend.outputs.all_changed_files }}
            
            # Extract only JS/TS files for ESLint
            JS_TS_FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '\.(js|jsx|ts|tsx)$' | tr '\n' ' ' || true)
            if [ -n "$JS_TS_FILES" ]; then
              npx --no-install eslint $JS_TS_FILES --fix || true
            fi
          fi

      - name: Commit and push auto-fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): auto-fix formatting and lint issues [skip ci]"
            git push
          else
            echo "No auto-fixes to commit."
          fi

  python-ci:
    name: Python CI (Ruff, Mypy, Pylint, Radon, Bandit, Pytest)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint radon bandit pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Fast Linter & Formatter)
        run: ruff check .

      - name: Run Mypy (Type Checking)
        run: mypy .

      - name: Run Pylint (Code Quality)
        run: pylint $(git ls-files '*.py')

      - name: Run Radon (Code Complexity Analysis)
        run: radon cc . -a -s

      - name: Run Bandit (Security Audit)
        run: bandit -r . -ll

      - name: Run Pytest with Coverage (>80%)
        run: pytest --cov=. --cov-fail-under=80

  frontend-ci:
    name: Frontend CI (Prettier, ESLint, TypeScript)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      # Fetch changed files in frontend-ci
      - name: Get changed frontend files
        id: changed-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.{js,jsx,ts,tsx,json,css,scss,md}

      - name: Run Prettier (Format Check on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -f package.json ]; then
            npx prettier --check ${{ steps.changed-frontend.outputs.all_changed_files }}
          fi

      - name: Run ESLint (Linter on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -f package.json ]; then
            JS_TS_FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '\.(js|jsx|ts|tsx)$' | tr '\n' ' ' || true)
            if [ -n "$JS_TS_FILES" ]; then
              npx --no-install eslint $JS_TS_FILES
            fi
          fi

      # TypeScript check stays global because type integrity spans files
      - name: Run TypeScript Compiler (Type Check)
        run: |
          if [ -f package.json ]; then npx tsc --noEmit; fi