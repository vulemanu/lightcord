name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    name: Auto-fix harmless issues (format/lint) and commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message || '', 'chore(ci): auto-fix formatting and lint issues')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff autopep8
          if [ -d backend ]; then cd backend && pip install -e . || true; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
          fi

      - name: Get changed frontend files
        id: changed-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: |
            frontend/**/*.{js,jsx,ts,tsx,json,css,scss,md}

      - name: Auto-fix Python issues
        run: |
          if [ -d backend ]; then
            cd backend
            ruff check . --fix || true
            autopep8 -r -i . || true
          else
            ruff check . --fix || true
            autopep8 -r -i . || true
          fi

      - name: Auto-fix frontend issues on changed files
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | sed 's|^frontend/||g' | sed 's| frontend/| |g')
            if [ -n "$FILES" ]; then
              npx prettier --write $FILES || true
              
              JS_TS_FILES=$(echo "$FILES" | tr ' ' '\n' | grep -E '\.(js|jsx|ts|tsx)$' | tr '\n' ' ' || true)
              if [ -n "$JS_TS_FILES" ]; then
                npx --no-install eslint $JS_TS_FILES --fix || true
              fi
            fi
          fi

      - name: Commit and push auto-fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(ci): auto-fix formatting and lint issues [skip ci]"
            git push
          else
            echo "No auto-fixes to commit."
          fi

  python-ci:
    name: Python CI (Ruff, Mypy, Pylint, Radon, Bandit, Pytest)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint radon bandit pytest pytest-cov
          if [ -d backend ]; then cd backend && pip install -e . || true; fi

      - name: Run Ruff (Fast Linter & Formatter)
        run: |
          if [ -d backend ]; then cd backend; fi
          ruff check .

      - name: Run Mypy (Type Checking)
        run: |
          if [ -d backend ]; then cd backend; fi
          mypy . || true

      - name: Run Pylint (Code Quality)
        run: |
          if [ -d backend ]; then cd backend; fi
          pylint $(git ls-files '*.py') || true

      - name: Run Radon (Code Complexity Analysis)
        run: |
          if [ -d backend ]; then cd backend; fi
          radon cc . -a -s || true

      - name: Run Bandit (Security Audit)
        run: |
          if [ -d backend ]; then cd backend; fi
          bandit -r . -ll || true

      - name: Run Pytest with Coverage (>80%)
        run: |
          if [ -d backend ]; then cd backend; fi
          pytest --cov=. --cov-fail-under=80 || true

  frontend-ci:
    name: Frontend CI (Prettier, ESLint, TypeScript)
    runs-on: ubuntu-latest
    needs: auto-fix
    if: always() && (needs.auto-fix.result == 'success' || needs.auto-fix.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
          fi

      - name: Get changed frontend files
        id: changed-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: |
            frontend/**/*.{js,jsx,ts,tsx,json,css,scss,md}

      - name: Run Prettier (Format Check on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | sed 's|^frontend/||g' | sed 's| frontend/| |g')
            if [ -n "$FILES" ]; then
              npx prettier --check $FILES || true
            fi
          fi

      - name: Run ESLint (Linter on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | sed 's|^frontend/||g' | sed 's| frontend/| |g')
            JS_TS_FILES=$(echo "$FILES" | tr ' ' '\n' | grep -E '\.(js|jsx|ts|tsx)$' | tr '\n' ' ' || true)
            if [ -n "$JS_TS_FILES" ]; then
              npx --no-install eslint $JS_TS_FILES || true
            fi
          fi

      - name: Run TypeScript Compiler (Type Check)
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            npx tsc --noEmit || true
          fi