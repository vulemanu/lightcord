name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    name: Python CI (Ruff, Mypy, Pylint, Radon, Bandit, Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint radon bandit pytest pytest-cov
          if [ -d backend ]; then
            cd backend
            pip install -e .
          fi

      - name: Run Ruff (Fast Linter & Formatter check)
        run: |
          if [ -d backend ]; then cd backend; fi
          ruff check .

      - name: Run Mypy (Type Checking)
        run: |
          if [ -d backend ]; then cd backend; fi
          mypy .

      - name: Run Pylint (Code Quality)
        run: |
          if [ -d backend ]; then cd backend; fi
          pylint $(git ls-files '*.py')

      - name: Run Radon (Code Complexity Analysis)
        run: |
          if [ -d backend ]; then cd backend; fi
          radon cc . -a -s

      - name: Run Bandit (Security Audit)
        run: |
          if [ -d backend ]; then cd backend; fi
          bandit -r . -ll

      - name: Run Pytest with Coverage (>80%)
        run: |
          if [ -d backend ]; then cd backend; fi
          pytest --cov=. --cov-fail-under=80

  frontend-ci:
    name: Frontend CI (Prettier, ESLint, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
          fi

      - name: Get changed frontend files
        id: changed-frontend
        uses: tj-actions/changed-files@v44
        with:
          files: |
            frontend/**/*.{js,jsx,ts,tsx,json,css,scss,md}

      - name: Run Prettier (Format Check on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | sed 's|^frontend/||g' | sed 's| frontend/| |g')
            if [ -n "$FILES" ]; then
              npx prettier --check $FILES
            fi
          fi

      - name: Run ESLint (Linter on changed files)
        if: steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            FILES=$(echo "${{ steps.changed-frontend.outputs.all_changed_files }}" | sed 's|^frontend/||g' | sed 's| frontend/| |g')
            JS_TS_FILES=$(echo "$FILES" | tr ' ' '\n' | grep -E '\.(js|jsx|ts|tsx)$' | tr '\n' ' ' || true)
            if [ -n "$JS_TS_FILES" ]; then
              npx --no-install eslint $JS_TS_FILES
            fi
          fi

      - name: Run TypeScript Compiler (Type Check)
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend
            npx tsc --noEmit
          fi
