name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-ci:
    name: Python CI (Ruff, Mypy, Pylint, Radon, Bandit, Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pylint radon bandit pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Fast Linter & Formatter)
        run: ruff check .

      - name: Run Mypy (Type Checking)
        run: mypy .

      - name: Run Pylint (Code Quality)
        run: pylint $(git ls-files '*.py')

      - name: Run Radon (Code Complexity Analysis)
        run: radon cc . -a -s

      - name: Run Bandit (Security Audit)
        run: bandit -r . -ll

      - name: Run Pytest with Coverage (>80%)
        run: pytest --cov=. --cov-fail-under=80

  frontend-ci:
    name: Frontend CI (Prettier, ESLint, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Prettier (Format Check)
        run: npx prettier --check .

      - name: Run ESLint (Linter)
        run: npx eslint .

      - name: Run TypeScript Compiler (Type Check)
        run: npx tsc --noEmit
